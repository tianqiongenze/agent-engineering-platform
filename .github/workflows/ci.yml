name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: uv sync
      - name: Lint
        run: |
          uv run ruff check src tests examples scripts
          uv run ruff format --check src tests
      - name: Typecheck
        run: uv run mypy src
      - name: Unit tests + coverage gate (≥80%)
        run: uv run pytest -m "unit" --cov --cov-report=xml --cov-report=term-missing
      - name: Enforce coverage threshold
        run: uv run python -m coverage report --fail-under=80
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  integration:
    runs-on: ubuntu-latest
    needs: quality
    services:
      docker: {}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: uv sync
      - name: Start infra
        run: docker compose -f docker-compose.infra.yml up -d --wait
      - name: Integration tests
        run: uv run pytest -m "integration"
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.infra.yml down -v
