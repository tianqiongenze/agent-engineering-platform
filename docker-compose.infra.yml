# Agent Engineering Platform · 基础设施拓扑
# 单机验证拓扑,多节点可移植(读写分离/事件骨干/向量库均按生产形态部署)
name: agent-platform-infra

services:
  # ── PostgreSQL 主从(读写分离)────────────────────────────
  pg-primary:
    image: postgres:16-alpine
    container_name: ap-pg-primary
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_pass   # 教学环境;生产必须走密钥管理
      POSTGRES_DB: agent_platform
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - hot_standby=on
    ports:
      - "5432:5432"
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./infra/pg/init-primary.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  pg-replica:
    image: postgres:16-alpine
    container_name: ap-pg-replica
    depends_on:
      pg-primary:
        condition: service_healthy
    environment:
      PGUSER: agent
      PGPASSWORD: agent_pass
      PRIMARY_HOST: pg-primary
      PRIMARY_PORT: "5432"
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: repl_pass
    entrypoint: [/bin/sh, /replica-entrypoint.sh]
    ports:
      - "5433:5432"
    volumes:
      - ./infra/pg/replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - pg_replica_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent && psql -U agent -tAc \"SELECT pg_is_in_recovery()\" | grep -q t"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ── Redis(L2 缓存 / 限流 / 热点状态)────────────────────
  redis:
    image: redis:7-alpine
    container_name: ap-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Pulsar(事件骨干:领域事件/审计/Outbox 投递/DLQ)──────
  pulsar:
    image: apachepulsar/pulsar:4.0.2
    container_name: ap-pulsar
    command: bin/pulsar standalone
    ports:
      - "6650:6650"    # 二进制协议
      - "8080:8080"    # HTTP admin
    volumes:
      - pulsar_data:/pulsar/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/admin/v2/brokers/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ── Milvus(向量检索:Codebase RAG / 语义缓存)───────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: ap-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: ap-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: ap-milvus
    depends_on: [etcd, minio]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 30

volumes:
  pg_primary_data:
  pg_replica_data:
  redis_data:
  pulsar_data:
  etcd_data:
  minio_data:
  milvus_data:
