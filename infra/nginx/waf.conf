# Nginx WAF / 边缘防护模板(审计报告 R10 · 部署层防线)
# 用途:置于 API 前的反向代理层,与平台应用层风控(security/)形成纵深。
# 部署:nginx -c infra/nginx/waf.conf(或 include 进现有 server 块)
# 依据:2026 业界共识 —— 限流+恶意特征拦截+安全头三件套为边缘标配。

worker_processes auto;
events { worker_connections 4096; }

http {
    # ── 基础 ─────────────────────────────────────────────
    access_log /var/log/nginx/aep_access.log;
    error_log  /var/log/nginx/aep_error.log warn;
    proxy_http_version 1.1;

    # ── 限流区(与平台令牌桶互补:边缘粗筛,应用层精筛)────
    limit_req_zone  $binary_remote_addr zone=api_edge:10m  rate=20r/s;   # 单 IP 边缘速率
    limit_req_zone  $http_authorization zone=tenant_edge:10m rate=50r/s; # 按凭证维度
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ── 恶意特征(注入载荷/扫描器 UA/异常方法)────────────
    map $request_uri $is_injection {
        default 0;
        ~*(ignore\+all\+previous|system\+prompt|<script|javascript:|\.\./\.\.|etc/passwd) 1;
    }
    map $http_user_agent $is_bad_ua {
        default 0;
        ~*(sqlmap|nikto|nmap|masscan|acunetix|hacker) 1;
    }

    # CVE-2021-44228 等 ${jndi: 载荷一律拒
    map $request $is_jndi {
        default 0;
        ~*\$\{jndi: 1;
    }

    upstream agent_platform {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── 请求体限制(LLM 场景 32KB 提示词上限足够)──────
        client_max_body_size 32k;
        client_body_timeout 10s;
        client_header_timeout 10s;

        # ── 限流执行 ─────────────────────────────────────
        limit_req  zone=api_edge  burst=40 nodelay;
        limit_req  zone=tenant_edge burst=100 nodelay;
        limit_conn conn_per_ip 20;
        limit_req_status 429;

        # ── 恶意特征拦截(444 = 静默断连,不给探测者信息)──
        if ($is_injection) { return 444; }
        if ($is_bad_ua)    { return 444; }
        if ($is_jndi)      { return 444; }

        # 只放行平台声明的路径
        location ~ ^/(healthz|metrics|graphql|v1/|console|static/|$) {
            # 安全头(大厂基线)
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'self'" always;

            # SSE 透传(禁缓冲:打字机效果的关键)
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_read_timeout 300s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://agent_platform;
        }
        location / { return 404; }   # 未声明白名单路径一律 404
    }
}
