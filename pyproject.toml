[project]
name = "agent-platform"
version = "0.1.0"
description = "AI Agent 全栈工程师训练营 · Agent Engineering Platform(教学与生产双用)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "strawberry-graphql[fastapi]>=0.246",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "pulsar-client>=3.5",
    "pymilvus>=2.5",
    "httpx>=0.28",
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "fakeredis[lua]>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: 需要真实基础设施(docker compose)的集成测试",
    "unit: 纯单元测试(CI 默认运行)",
]

[tool.coverage.run]
source = ["src/agent_platform"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# PPT 内容与生成器:DSL/中文内容字符串天然超长,豁免行长
"scripts/enrich_visuals.py" = ["E501", "RUF001", "RUF005"]
"scripts/gen_pptx.py" = ["E501", "E702", "E741", "F841", "RUF005", "B905"]
"scripts/pptx_visuals.py" = ["E501", "E702", "E741", "F841", "RUF001", "RUF005", "RUF034", "RUF059", "B905", "S110"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # 测试与教学代码允许 assert

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
